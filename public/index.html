<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TravelBuddy" />
  <title>TravelBuddy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preload" href="fonts/PlusJakartaSans-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/InstrumentSerif-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script>if (/[?&]lat=/.test(location.search)) document.documentElement.classList.add("booted");</script>
</head>
<body>
  <!-- Line icon set (24px grid, 1.8 stroke) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M15.8 8.2l-2.2 5.4-5.4 2.2 2.2-5.4z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 20.5 11.5z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.3 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.5-4.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 1 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2.2-6.5L15 17v4M9 12l1.5-4.5 3.5 1 2 3.5 2.5 1M10.5 7.5L7 10v3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol>
  </svg>

  <!-- Welcome -->
  <section id="welcome" class="welcome">
    <div class="welcome-art" id="welcomeArt"></div>
    <div class="welcome-inner stagger">
      <h1 class="wordmark serif">Travel<i>Buddy</i></h1>
      <p>Every neighborhood has a flavor. Open your pocket food guide to hear what it eats, and where to go hungry.</p>
      <button id="locateBtn" class="btn primary"><svg class="icon sm"><use href="#i-locate"/></svg><span>Find food near me</span></button>
      <button class="ghost-search" data-open-search><svg class="icon sm"><use href="#i-search"/></svg>Search any place</button>
      <p id="startError" class="error" hidden></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <!-- Explore -->
    <section id="view-explore" class="view">
      <header class="topbar">
        <div class="wordmark serif">TravelBuddy</div>
        <button class="icon-btn" data-goto="ask" aria-label="Questions nearby"><svg class="icon"><use href="#i-chat"/></svg></button>
      </header>
      <button class="searchpill" data-open-search aria-label="Change place">
        <svg class="icon sm"><use href="#i-search"/></svg>
        <div class="txt"><div class="t" id="pillTitle">Finding you…</div><div class="s" id="pillSub">Looking for good food nearby</div></div>
        <span class="loc" id="hereBtn" role="button" aria-label="Use my location"><svg class="icon sm"><use href="#i-locate"/></svg></span>
      </button>
      <div id="storiesRow" class="stories-row" aria-label="Stories"></div>
      <div id="heroWrap"></div>
      <div class="section guide-section">
        <div class="section-head"><h2>What's cooking here</h2><button class="link" data-story="tour" id="guidePlay">Play as story</button></div>
        <div id="guide" class="guide" aria-live="polite"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>Where to eat nearby</h2><span class="muted" id="lmCount"></span></div>
        <div id="rail" class="rail"></div>
        <div class="muted source-note" id="sourceNote"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>People nearby are asking</h2><button class="link" data-goto="ask">See all</button></div>
        <div id="previewQa" class="preview-list feed"></div>
      </div>
    </section>

    <!-- Ask -->
    <section id="view-ask" class="view with-composer" hidden>
      <header class="topbar"><h1>Ask the guide</h1></header>
      <div class="muted" style="padding: 0 16px; font-size: 14px" id="askSub">Food questions from people near here</div>
      <div id="chips" class="chips"></div>
      <div id="feed" class="feed"></div>
    </section>

    <!-- Saved -->
    <section id="view-saved" class="view" hidden>
      <header class="topbar"><h1>Saved</h1></header>
      <div id="savedGrid"></div>
    </section>

    <form id="composer" class="composer" hidden autocomplete="off">
      <input id="question" maxlength="500" placeholder="Ask about food around here…" aria-label="Your question" enterkeyhint="send" />
      <button class="send" id="askBtn" aria-label="Send"><svg class="icon sm"><use href="#i-send"/></svg></button>
    </form>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-tab="explore"><svg class="icon"><use href="#i-compass"/></svg>Explore</button>
      <button class="tab" data-tab="ask"><svg class="icon"><use href="#i-chat"/></svg>Ask<b id="qaBadge" class="badge" hidden></b></button>
      <button class="tab" data-tab="saved"><svg class="icon"><use href="#i-heart"/></svg>Saved</button>
    </nav>
  </div>

  <!-- Story viewer -->
  <section id="story" class="layer story" hidden aria-label="Story">
    <div class="bg" id="storyBg"></div>
    <div class="top">
      <div class="bars" id="bars"></div>
      <div class="who">
        <div class="ring"><div class="ph" id="storyAvatar"></div></div>
        <div class="name"><span id="storyName"></span><small id="storySub"></small></div>
        <button class="icon-btn" id="soundBtn" aria-label="Read aloud"><svg class="icon"><use href="#i-mute"/></svg></button>
        <button class="icon-btn" id="storyClose" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="tap prev" data-tap="prev"></div>
    <div class="tap next" data-tap="next"></div>
    <div class="content" id="storyContent"></div>
    <svg class="icon paused-hint" style="width:64px;height:64px"><use href="#i-play"/></svg>
    <form class="bottom" id="storyReply" autocomplete="off">
      <input id="storyQ" maxlength="500" placeholder="Ask about this…" aria-label="Ask about this story" enterkeyhint="send" />
      <button class="send" aria-label="Send"><svg class="icon sm"><use href="#i-send"/></svg></button>
    </form>
  </section>

  <!-- Landmark detail -->
  <section id="detail" class="layer detail" hidden aria-label="Place to eat"></section>

  <!-- Search -->
  <section id="search" class="layer search-layer" hidden aria-label="Search">
    <form class="bar" id="searchForm" autocomplete="off">
      <button type="button" class="icon-btn" data-close-search aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
      <label class="field"><svg class="icon sm"><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="Where to?" enterkeyhint="search" /></label>
    </form>
    <div class="list">
      <button class="opt" id="searchHere"><span class="ic"><svg class="icon"><use href="#i-locate"/></svg></span><span><div class="t">Near me</div><div class="s">Use your current location</div></span></button>
      <div id="recents"></div>
      <h4>Try somewhere famous</h4>
      <div id="ideas"></div>
    </div>
  </section>

  <script src="app.js" type="module"></script>
</body>
</html>
